<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car One USA | Premium Truck Inventory</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">CAR ONE <span>USA</span></div>
            <nav>
                <ul>
                    <li><a href="#inventory">Inventory</a></li>
                    <li><a href="https://www.caroneusa.net/" target="_blank">Full Site</a></li>
                    <li><a href="tel:+19548600537" class="nav-phone"><i class="fas fa-phone"></i> (954) 860-0537</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="hero-overlay"></div>
        <div class="container hero-content">
            <h1>PREMIUM TRUCKS IN FLORIDA</h1>
            <p>Quality pre-owned trucks with unbeatable financing options.</p>
            <a href="#inventory" class="btn-primary">Browse Inventory</a>
        </div>
    </section>

    <section id="inventory" class="inventory">
        <div class="container">
            <h2 class="section-title">Current Inventory</h2>
            <div class="truck-grid" id="truck-grid">
                <!-- Trucks will be loaded here via JS -->
                <div class="loading">Loading our best deals...</div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Car One USA | 123 Truck Lane, Florida</p>
            <div class="social">
                <a href="#"><i class="fab fa-facebook"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
            </div>
            <p class="dev-by">Powered by <strong>ASKIVAN AI</strong></p>
        </div>
    </footer>

    <!-- Vapi Voice AI (Lara Vendedora - Coming Soon) -->
    <script src="js/main.js"></script>
</body>
</html>
